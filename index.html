<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <meta name="description" content="Calculadora simples, rápida e responsiva.">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">＋</span><span>calculadora</span></div>
      <span class="tag">SIMPLES • RÁPIDA</span>
    </header>
    <section class="calculator" aria-label="Calculadora">
      <div class="screen">
        <div class="screen-label" id="status">Pronto para calcular</div>
        <div class="expression" id="expression" aria-live="polite">0</div>
        <div class="result" id="result" aria-live="polite">0</div>
      </div>
      <div class="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="sign">±</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-operator="÷">÷</button>
        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key operator" data-operator="×">×</button>
        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key operator" data-operator="−">−</button>
        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key operator" data-operator="+">+</button>
        <button class="key zero" data-number="0">0</button>
        <button class="key" data-action="decimal">,</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
      <footer class="calculator-footer">
        <span>Use o teclado ou clique nos botões</span>
        <button id="copy" class="copy-button" type="button">Copiar resultado</button>
      </footer>
    </section>
    <p class="credit">Feita para funcionar direto no navegador.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
